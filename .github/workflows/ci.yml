name: CI

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: ['main']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend/GroupSwitch.sln
      - run: dotnet build backend/GroupSwitch.sln --no-restore -c Release
      - run: dotnet test backend/GroupSwitch.sln --no-build -c Release --filter "Category!=Online"

  frontend:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend
